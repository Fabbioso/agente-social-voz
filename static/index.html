<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <meta name="theme-color" content="#08090d">
  <title>Sofia - Voz em Tempo Real</title>
  <style>
    :root {
      color-scheme: dark;
      --text-primary: #f4f2f8;
      --text-muted: #9895a3;
      --surface: rgba(255, 255, 255, 0.055);
    }

    * { box-sizing: border-box; }

    body {
      height: 100vh;
      height: 100dvh;
      min-height: 420px;
      margin: 0;
      padding: max(28px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: var(--text-primary);
      background: #08090d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    header { display: grid; justify-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.2; font-weight: 550; color: #fff; }

    #status {
      min-height: 30px;
      margin: 0;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #status::before {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      content: "";
      border-radius: 50%;
      background: #74717d;
      box-shadow: 0 0 8px rgba(116, 113, 125, 0.35);
    }
    #status[data-state="connecting"]::before { background: #f5b942; box-shadow: 0 0 10px rgba(245, 185, 66, 0.7); }
    #status[data-state="ready"]::before { background: #34d399; box-shadow: 0 0 11px rgba(52, 211, 153, 0.8); }
    #status[data-state="speaking"]::before {
      background: #c4a7ff;
      box-shadow: 0 0 12px rgba(196, 167, 255, 0.9);
      animation: status-pulse 1.2s ease-in-out infinite;
    }

    .orb-container {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .orb {
      width: 160px;
      height: 160px;
      flex: 0 0 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #a5f3fc, #6366f1 45%, #3b82f6 75%, #1e1b4b 100%);
      box-shadow: 0 0 45px rgba(99, 102, 241, 0.45), 0 0 90px rgba(59, 130, 246, 0.25);
      transition: transform 0.08s ease-out, box-shadow 0.15s ease;
      animation: orb-breathe 4s ease-in-out infinite;
      will-change: transform, box-shadow;
    }
    .orb.listening {
      box-shadow: 0 0 45px rgba(99, 102, 241, 0.5), 0 0 90px rgba(59, 130, 246, 0.3);
    }
    .orb.speaking {
      animation: none;
    }
    #orb-caption {
      min-height: 20px;
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 180ms ease, opacity 180ms ease;
    }
    #orb-caption[data-state="speaking"] { color: #c4b5fd; }

    .controls {
      width: min(100%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 4px;
    }
    .mode-switch {
      width: 100%;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text-muted);
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .mode-switch label {
      position: relative;
      flex: 1;
      min-width: 0;
      padding: 11px 8px;
      border-radius: 9999px;
      text-align: center;
      cursor: pointer;
      transition: background 220ms ease, color 220ms ease, box-shadow 220ms ease;
    }
    .mode-switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .mode-switch label:has(input:checked) {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 2px 8px rgba(0, 0, 0, 0.18);
    }
    .mode-switch label:has(input:focus-visible) { outline: 2px solid #c4a7ff; outline-offset: 2px; }

    .btn {
      width: 100%;
      min-height: 56px;
      padding: 16px 24px;
      border: 1px solid transparent;
      border-radius: 9999px;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, filter 200ms ease, box-shadow 200ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { cursor: wait; filter: saturate(0.7); opacity: 0.78; }
    .btn-connect {
      background: linear-gradient(110deg, #168b70, #22a88d 55%, #38b6a1);
      box-shadow: 0 8px 28px rgba(28, 166, 136, 0.22), inset 0 1px rgba(255, 255, 255, 0.18);
    }
    .btn-connect:hover { filter: brightness(1.08); box-shadow: 0 10px 34px rgba(28, 166, 136, 0.3); }
    .btn-connect.is-connected {
      width: 56px;
      min-height: 56px;
      padding: 0;
      border-radius: 50%;
      background: linear-gradient(110deg, #702f3e, #a33e4d 58%, #b84c57);
      box-shadow: 0 4px 18px rgba(163, 62, 77, 0.2), inset 0 1px rgba(255, 255, 255, 0.14);
      font-size: 0;
    }
    .btn-connect.is-connected::before {
      content: "×";
      font-size: 26px;
      font-weight: 400;
      line-height: 1;
    }
    .btn-connect.is-connected:hover { filter: brightness(1.08); box-shadow: 0 6px 22px rgba(163, 62, 77, 0.28); }
    .btn-ptt {
      display: none;
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(255, 255, 255, 0.12);
      color: #f2eff8;
      user-select: none;
      touch-action: none;
    }
    .btn-ptt.active {
      background: linear-gradient(110deg, #843849, #b34855);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 26px rgba(179, 72, 85, 0.25);
    }

    @keyframes orb-breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.72; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (max-height: 620px) {
      body { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
      .controls { gap: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sofia</h1>
    <p id="status" data-state="disconnected">Desconectado</p>
  </header>

  <div class="orb-container">
    <div id="orb" class="orb"></div>
    <p id="orb-caption" data-state="idle">Toque para conversar</p>
  </div>

  <div class="controls">
    <div class="mode-switch">
      <label><input type="radio" name="mode" value="handsfree" checked><span>Mãos-Livres</span></label>
      <label><input type="radio" name="mode" value="ptt"><span>Push-to-Talk</span></label>
    </div>
    <button id="btnConnect" class="btn btn-connect">Conectar</button>
    <button id="btnPtt" class="btn btn-ptt">Segure para Falar</button>
  </div>

  <script>
    const cacheVersion = '3';
    if ('caches' in window && localStorage.getItem('sofiaCacheVersion') !== cacheVersion) {
      caches.keys()
        .then(cacheNames => Promise.all(cacheNames.map(cacheName => caches.delete(cacheName))))
        .then(() => localStorage.setItem('sofiaCacheVersion', cacheVersion));
    }

    let ws, audioCtx, audioAnalyser, frequencyData, micStream, processor;
    let isPttActive = false;
    let isAiPlaying = false;
    let aiTurnTimeout = null;
    let nextPlayTime = 0;
    let activeSources = [];
    let wakeLock = null;

    function abortAudioQueue() {
      if (aiTurnTimeout) {
        clearTimeout(aiTurnTimeout);
        aiTurnTimeout = null;
      }
      if (typeof activeSources !== 'undefined' && Array.isArray(activeSources)) {
        activeSources.forEach(source => {
          try { source.stop(); } catch(e) {}
        });
        activeSources = [];
      }
      nextPlayTime = 0;
      isAiPlaying = false;
      setOrbState(ws && ws.readyState === WebSocket.OPEN ? 'listening' : 'idle');
      statusText.innerText = "Ouvindo...";
    }

    function setOrbState(state) {
      orb.className = state === 'speaking' ? 'orb speaking'
        : state === 'listening' ? 'orb listening'
        : 'orb';
      orbCaption.dataset.state = state;
      orbCaption.innerText = state === 'speaking' ? 'Sofia...'
        : state === 'listening' ? 'Ouvindo...'
        : 'Toque para conversar';
    }

    function animateOrb() {
      requestAnimationFrame(animateOrb);
      if (!audioAnalyser || !frequencyData || !isAiPlaying || orbCaption.dataset.state !== 'speaking') {
        orb.style.removeProperty('transform');
        orb.style.removeProperty('box-shadow');
        return;
      }

      audioAnalyser.getByteFrequencyData(frequencyData);
      const average = frequencyData.reduce((sum, value) => sum + value, 0) / frequencyData.length;
      const volumeNormalized = Math.min(1, average / 255);
      const scale = 1 + volumeNormalized * 0.35;
      const glow = 45 + volumeNormalized * 55;
      const outerGlow = 90 + volumeNormalized * 70;
      orb.style.transform = `scale(${scale})`;
      orb.style.boxShadow = `0 0 ${glow}px rgba(99, 102, 241, ${0.45 + volumeNormalized * 0.35}), 0 0 ${outerGlow}px rgba(59, 130, 246, ${0.25 + volumeNormalized * 0.3})`;
    }

    async function setWakeLock(active) {
      if (!('wakeLock' in navigator)) return;

      try {
        if (active && !wakeLock) {
          const lock = await navigator.wakeLock.request('screen');
          wakeLock = lock;
          lock.addEventListener('release', () => {
            if (wakeLock === lock) wakeLock = null;
          }, { once: true });
        } else if (!active && wakeLock) {
          const lock = wakeLock;
          wakeLock = null;
          await lock.release();
        }
      } catch (error) {
        console.warn('Não foi possível atualizar o Wake Lock:', error);
      }
    }

    const orb = document.getElementById('orb');
    const orbCaption = document.getElementById('orb-caption');
    const statusText = document.getElementById('status');
    const btnConnect = document.getElementById('btnConnect');
    const btnPtt = document.getElementById('btnPtt');
    const modeRadios = document.querySelectorAll('input[name="mode"]');
    btnConnect.setAttribute('aria-label', 'Conectar à Sofia');
    requestAnimationFrame(animateOrb);

    const statusObserver = new MutationObserver(() => {
      const message = statusText.innerText.toLowerCase();
      statusText.dataset.state = message.includes('falando') ? 'speaking'
        : message.includes('conectando') || message.includes('inicializando') ? 'connecting'
        : message.includes('desconectado') ? 'disconnected'
        : message.includes('pront') || message.includes('ouvindo') || message.includes('conectado') ? 'ready'
        : 'disconnected';
    });
    statusObserver.observe(statusText, { childList: true, characterData: true, subtree: true });

    function getSelectedMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    modeRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        btnPtt.style.display = getSelectedMode() === 'ptt' ? 'block' : 'none';
      });
    });

    btnConnect.onclick = async () => {
      if (btnConnect.disabled) return;
      btnConnect.disabled = true;

      if (ws) {
        ws.close();
        return;
      }

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        await audioCtx.resume();
        audioAnalyser = audioCtx.createAnalyser();
        audioAnalyser.fftSize = 64;
        frequencyData = new Uint8Array(audioAnalyser.frequencyBinCount);
        audioAnalyser.connect(audioCtx.destination);

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/audio`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = async () => {
          try {
            await setWakeLock(true);
            statusText.innerText = "Conectado. Inicializando áudio...";
            btnConnect.innerText = "Desconectar";
            btnConnect.setAttribute('aria-label', 'Encerrar chamada com a Sofia');
            btnConnect.classList.add('is-connected');
            await iniciarMicrofone();
            setOrbState('listening');
            btnConnect.disabled = false;
          } catch (error) {
            console.error('Não foi possível iniciar o microfone:', error);
            statusText.innerText = "Não foi possível acessar o microfone";
            ws.close();
          }
        };

        ws.onmessage = async (event) => {
          if (typeof event.data === 'string' && event.data === 'INTERRUPT') {
            isAiPlaying = false;
            abortAudioQueue();
            return;
          }

          if (aiTurnTimeout) {
            clearTimeout(aiTurnTimeout);
            aiTurnTimeout = null;
          }

          if (!isAiPlaying) {
            isAiPlaying = true;
            nextPlayTime = audioCtx.currentTime + 0.08;
            setOrbState('speaking');
            statusText.innerText = "Sofia falando...";
          }

          const arrayBuffer = event.data;
          const sampleCount = Math.floor(arrayBuffer.byteLength / 2);
          const pcmView = new DataView(arrayBuffer);
          const float32Data = new Float32Array(sampleCount);
          for (let i = 0; i < sampleCount; i++) {
            float32Data[i] = pcmView.getInt16(i * 2, true) / 32768.0;
          }

          const audioBuffer = audioCtx.createBuffer(1, float32Data.length, 24000);
          audioBuffer.copyToChannel(float32Data, 0);

          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioAnalyser);
          activeSources.push(source);

          source.onended = () => {
            activeSources = activeSources.filter(s => s !== source);
            if (activeSources.length === 0) {
              if (aiTurnTimeout) clearTimeout(aiTurnTimeout);
              aiTurnTimeout = setTimeout(() => {
                if (activeSources.length === 0) {
                  isAiPlaying = false;
                  nextPlayTime = 0;
                  setOrbState(ws && ws.readyState === WebSocket.OPEN ? 'listening' : 'idle');
                  statusText.innerText = "Ouvindo...";
                }
              }, 350);
            }
          };

          const startTime = Math.max(audioCtx.currentTime, nextPlayTime);
          source.start(startTime);
          nextPlayTime = startTime + audioBuffer.duration;
        };

        ws.onclose = () => {
          setWakeLock(false);
          statusText.innerText = "Desconectado";
          btnConnect.innerText = "Conectar";
          btnConnect.setAttribute('aria-label', 'Conectar à Sofia');
          btnConnect.classList.remove('is-connected');
          btnConnect.disabled = false;
          setOrbState('idle');
          pararMicrofone();
          ws = null;
        };
      } catch (error) {
        console.error('Não foi possível conectar:', error);
        statusText.innerText = "Não foi possível conectar";
        btnConnect.disabled = false;
        ws = null;
      }
    };

    async function iniciarMicrofone() {
      const audioConstraints = {
        audio: {
          echoCancellation: { ideal: true },
          noiseSuppression: { ideal: true },
          autoGainControl: { ideal: true },
          channelCount: 1,
        }
      };
      micStream = await navigator.mediaDevices.getUserMedia(audioConstraints);

      const micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = micCtx.createMediaStreamSource(micStream);
      processor = micCtx.createScriptProcessor(2048, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const currentMode = getSelectedMode();
        if (isAiPlaying && currentMode === 'handsfree') {
          return;
        }
        if (currentMode === 'handsfree' && audioCtx && audioCtx.currentTime < (nextPlayTime + 0.35)) {
          return;
        }
        if (currentMode === 'ptt' && !isPttActive) return;

        const inputData = e.inputBuffer.getChannelData(0);

        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        ws.send(pcm16.buffer);
      };

      source.connect(processor);
      processor.connect(micCtx.destination);
      statusText.innerText = "Pronto! Pode falar com a Sofia.";
    }

    function pararMicrofone() {
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (processor) processor.disconnect();
    }

    btnPtt.addEventListener('touchstart', (e) => { e.preventDefault(); isPttActive = true; btnPtt.classList.add('active'); });
    btnPtt.addEventListener('touchend', (e) => { e.preventDefault(); isPttActive = false; btnPtt.classList.remove('active'); });
    btnPtt.addEventListener('mousedown', () => { isPttActive = true; btnPtt.classList.add('active'); });
    btnPtt.addEventListener('mouseup', () => { isPttActive = false; btnPtt.classList.remove('active'); });
  </script>
</body>
</html>
